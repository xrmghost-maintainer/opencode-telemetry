name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: skip tag push and npm publish (for testing)"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        # npm@latest (12.x) requires Node ^22.22.2; trusted publishing needs npm >= 11.5.1.
        run: npm install -g npm@11

      - name: Show node/npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun tsc --noEmit

      - name: Compute next patch version from latest git tag
        id: version
        run: |
          git fetch --tags

          NEW_VERSION="v$(node scripts/next-version.js)"

          echo "Next version: ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          # Update package.json only in the workspace (never committed to main)
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Create and push tag
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm publish --access public --provenance

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "=== DRY RUN — nothing was pushed or published ==="
          echo "Would have created tag: ${{ steps.version.outputs.version }}"
          echo "Would have published version: ${{ steps.version.outputs.version }}"
          node -p "require('./package.json').version"
